name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  FIREBASE_PROJECT: ajansonline
  HOSTING_SITE: nilasyayag

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  deploy:
    name: Deploy to Firebase Hosting
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.FIREBASE_SERVICE_ACCOUNT != '' && secrets.NILASYA_SESSION_SECRET != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://nilasyayag.web.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15

      - name: Write runtime environment (.env.local)
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://www.asiaoil.com.tr' }}
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL || 'export@asiaoil.com.tr' }}
          NILASYA_SESSION_SECRET: ${{ secrets.NILASYA_SESSION_SECRET }}
          NILASYA_ADMIN_PASSWORD: ${{ secrets.NILASYA_ADMIN_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$NILASYA_SESSION_SECRET" ] || [ -z "$NILASYA_ADMIN_PASSWORD" ]; then
            echo "::error::NILASYA_SESSION_SECRET ve NILASYA_ADMIN_PASSWORD repo Secrets içinde tanımlı olmalı."
            exit 1
          fi
          # Values are double-quoted and escaped so dotenv parsers keep special characters intact.
          kv() { printf '%s="%s"\n' "$1" "$(printf '%s' "$2" | sed 's/\\/\\\\/g; s/"/\\"/g')"; }
          {
            kv NEXT_PUBLIC_SITE_URL "$NEXT_PUBLIC_SITE_URL"
            kv NILASYA_SESSION_SECRET "$NILASYA_SESSION_SECRET"
            kv NILASYA_ADMIN_PASSWORD "$NILASYA_ADMIN_PASSWORD"
            kv NOTIFY_EMAIL "$NOTIFY_EMAIL"
            kv RESEND_API_KEY "$RESEND_API_KEY"
            kv NOTIFY_FROM "$NOTIFY_FROM"
            kv FIREBASE_PROJECT_ID "$FIREBASE_PROJECT"
            kv FIREBASE_WEB_API_KEY "$FIREBASE_WEB_API_KEY"
          } > .env.local

      - name: Authenticate with service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT (servis hesabı JSON) repo Secrets içinde tanımlı olmalı."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Deploy hosting (Next.js web frameworks)
        run: |
          set -euo pipefail
          firebase experiments:enable webframeworks
          firebase deploy \
            --only "hosting:${HOSTING_SITE}" \
            --project "$FIREBASE_PROJECT" \
            --non-interactive \
            --force

      - name: Smoke test live site
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L https://nilasyayag.web.app/tr || true)
            if [ "$code" = "200" ]; then echo "Live: HTTP $code"; exit 0; fi
            echo "Attempt $i: HTTP $code, retrying..."; sleep 10
          done
          echo "::error::Canlı site 200 dönmedi."; exit 1

      - name: Cleanup credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json" .env.local
