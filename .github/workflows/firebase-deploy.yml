name: Deploy to Firebase Hosting (www.asiaoil.com.tr)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: firebase-hosting-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    name: Build & Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Cache Next.js build (.next/cache)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: npm ci

      - name: Restore .env.local from GitHub Secrets
        env:
          DOTENV_LOCAL: ${{ secrets.DOTENV_LOCAL }}
        run: |
          if [ -n "$DOTENV_LOCAL" ]; then
            printf '%s\n' "$DOTENV_LOCAL" > .env.local
            cp .env.local .env
          fi

      - name: Run Lint, TypeScript & Vitest checks
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Authenticate Google Cloud & Deploy to Firebase Hosting
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
          FUNCTIONS_DISCOVERY_TIMEOUT: "60"
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AJANSONLINE }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_AJANSONLINE secret is missing"
            exit 1
          fi
          printf '%s' "$SA_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@15 deploy --only hosting:nilasyayag --project ajansonline --force
          node scripts/cleanup-hosting-versions.mjs --apply --site=nilasyayag || true
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
